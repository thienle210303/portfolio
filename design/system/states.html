<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Pass, outdoors — component states</title>
    <!-- Captured from the real components by `pnpm shots` (round 25, production
         build of round-25/responsive-system, 2026-11-06), so this page cannot drift from the site: when a
         component changes, re-run the capture and replace the pictures. -->
    <link rel="stylesheet" href="../round-25-responsive/v1/boards/board.css" />
    <script src="../round-25-responsive/v1/boards/board.js"></script>
    <style>
      main {
        display: grid;
        gap: 40px;
        padding-block: 48px 96px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 28px 20px;
        align-items: start;
      }
      figure {
        margin: 0;
        display: grid;
        gap: 8px;
      }
      figure a {
        display: block;
        max-height: 420px;
        overflow: hidden;
        border: 1px solid var(--rule-color);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      .wide {
        grid-column: span 2;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header style="display: grid; gap: 10px">
        <p class="label">design/system</p>
        <h1 class="chapter">Component states</h1>
        <p class="aside">
          The real components, as captured. Every control also has rest, hover, focus-visible,
          pressed and disabled; forms have empty, error, sending and sent, in first person.
          <a href="index.html">Back to the specimen</a>
        </p>
      </header>

      <div class="grid">
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-menu-open-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-menu-open-390.jpg" alt="" /></a>
          <figcaption><strong>Menu, open.</strong> A notebook page under the strip that ends with Let's talk and Résumé; the cats drop below it; Escape and the tag close it.</figcaption>
        </figure>
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-tag-turned-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-tag-turned-390.jpg" alt="" /></a>
          <figcaption><strong>Chapter tag, turned.</strong> A press turns the tag to my line about it, with "Read this part".</figcaption>
        </figure>
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-focus-ring-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-focus-ring-390.jpg" alt="" /></a>
          <figcaption><strong>Focus-visible.</strong> 2px ring, 3px offset, on whatever paper it is on.</figcaption>
        </figure>
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-diary-next-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-diary-next-390.jpg" alt="" /></a>
          <figcaption><strong>Diary, a page on.</strong> Corners and arrows turn; "p. 3 of 18" announces. Where one page shows, it is as tall as what is on it.</figcaption>
        </figure>
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-diary-track-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-diary-track-390.jpg" alt="" /></a>
          <figcaption><strong>Diary, reduced motion.</strong> The same pages as a scroll-snap track; nothing turns.</figcaption>
        </figure>
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-certificate-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-certificate-390.jpg" alt="" /></a>
          <figcaption><strong>Certificate, open.</strong> A native dialog over a dimmed book; Close and Escape.</figcaption>
        </figure>
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-form-error-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-form-error-390.jpg" alt="" /></a>
          <figcaption><strong>Lead form, error.</strong> One error for the name, one for the email-or-phone pair (two whole lines, one bracket), in first person.</figcaption>
        </figure>
        <figure>
          <a href="../round-25-responsive/v1/previews/final/state-ask-answered-390.jpg"><img src="../round-25-responsive/v1/previews/final/state-ask-answered-390.jpg" alt="" /></a>
          <figcaption><strong>Ask, answered (phone).</strong> A ticket stub, then clippings, in a window up to 60% of the screen. Idle, the notepad is only as tall as its promise.</figcaption>
        </figure>
        <figure class="wide">
          <a href="../round-25-responsive/v1/previews/final/state-ask-answered-1440.jpg"><img src="../round-25-responsive/v1/previews/final/state-ask-answered-1440.jpg" alt="" /></a>
          <figcaption><strong>Ask, answered (desktop).</strong> Clippings taped under "I said", each with its source.</figcaption>
        </figure>
        <figure class="wide">
          <a href="../round-25-responsive/v1/previews/final/state-resume-dialog-1440.jpg"><img src="../round-25-responsive/v1/previews/final/state-resume-dialog-1440.jpg" alt="" /></a>
          <figcaption><strong>Résumé dialog.</strong> From 640 with JavaScript; the PDF is blank here because headless Chromium does not render PDFs.</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
